name: ClassePiu APK

on:
  push:
    branches: [classepiu, main]
    paths:
      - "app/**"
      - ".github/workflows/classepiu.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compila APK
        id: build
        shell: bash
        run: |
          set -o pipefail
          gradle -p app :classepiu:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Pubblica APK e log sul ramo apk
        if: always()
        shell: bash
        run: |
          mkdir -p out
          cp build.log out/build.log || echo "nessun log" > out/build.log
          APK=$(ls app/classepiu/build/outputs/apk/release/*.apk 2>/dev/null | head -1 || true)
          if [ -n "$APK" ]; then
            cp "$APK" out/ClassePiu.apk
            echo "ok run ${GITHUB_RUN_NUMBER} $(date -u +%FT%TZ) ${GITHUB_SHA}" > out/stato.txt
          else
            echo "errore run ${GITHUB_RUN_NUMBER} $(date -u +%FT%TZ) ${GITHUB_SHA}" > out/stato.txt
            git fetch origin apk:apk-old 2>/dev/null && git show apk-old:ClassePiu.apk > out/ClassePiu.apk 2>/dev/null || rm -f out/ClassePiu.apk
          fi
          cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "ClassePiu build ${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
