name: Test connessione ClasseViva

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/test-connessione.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Homepage ClasseViva
        run: |
          r=$(curl -sS -o /dev/null -w "homepage HTTP %{http_code}" https://web.spaggiari.eu/home/app/default/login.php || true); echo "::notice::$r"
      - name: API ClasseViva (senza credenziali)
        run: |
          curl -sS -o body.txt -w "api login -> HTTP %{http_code}\n" -X POST https://web.spaggiari.eu/rest/v1/auth/login \
            -H "User-Agent: CVVS/std/4.2.3 Android/12" -H "Z-Dev-Apikey: Tg1NWEwNGIgIC0K" \
            -H "Content-Type: application/json" -d '{"ident":null,"pass":"x","uid":"x"}' || true
          echo "::notice::api login $(head -c 250 body.txt | tr -d '\n\r')"
