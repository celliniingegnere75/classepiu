name: Fix decimalValue

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix decimalValue validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/classepiu/src/main/java/it/cellini/classepiu/Api.kt')
          s = p.read_text()
          old = '''        if (!media) o.put("decimalValue", JSONObject.NULL) else if (decimale != null) o.put("decimalValue", decimale)'''
          new = '''        // ClasseViva richiede decimalValue sempre numerico nel PUT di grades2.
        // Non inviare mai JSONObject.NULL: se il valore scelto non arriva dalla UI,
        // recuperalo dal voto originale oppure da displayValue.
        val decimalDaPayload = o.opt("decimalValue")
            ?.takeIf { it != JSONObject.NULL }
            ?.let { (it as? Number)?.toDouble() }
        val decimalDaDisplay = o.optString("displayValue")
            .replace(',', '.')
            .toDoubleOrNull()
        val decimalFinale = when {
            decimale != null && !decimale.isNaN() -> decimale
            decimalDaPayload != null && !decimalDaPayload.isNaN() -> decimalDaPayload
            decimalDaDisplay != null && !decimalDaDisplay.isNaN() -> decimalDaDisplay
            else -> 0.0
        }
        o.put("decimalValue", decimalFinale)'''
          if old not in s:
              raise SystemExit('Pattern decimalValue non trovato; nessuna modifica eseguita')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/classepiu/src/main/java/it/cellini/classepiu/Api.kt
          git commit -m 'Fix decimalValue in grade update payload'
          git push
