name: Build ClassePiu APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Android app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set higher version code for recovery APK
        run: sed -i 's/versionCode = buildNumber/versionCode = 100000 + buildNumber/' app/classepiu/build.gradle.kts

      - name: Run unit tests and build debug APK
        run: gradle --no-daemon -p app clean testDebugUnitTest assembleDebug

      - name: Rename APK
        run: cp app/classepiu/build/outputs/apk/debug/*.apk app/classepiu.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: classepiu
          path: app/classepiu.apk
          if-no-files-found: error
          retention-days: 14
